onal School","https://www.lcis.bs/home"],"S02":["Windsor campuses","https://www.windsorschoolbahamas.com/about/campuses"],"S03":["St Andrew’s International School","https://st-andrews.com/"],"S04":["Tambearly International School","https://tambearlyschool.org/"],"S05":["Queen’s College","https://www.qchenceforth.com/"],"S06":["Blue Sail","https://www.bluesailbahamas.com/"],"S07":["Sandyport dining","https://sandyportbeachresort.com/dine-and-drink/"],"S08":["Palm Cay restaurant","https://palmcay.com/restaurant/"],"S09":["Baha Mar dining","https://bahamar.com/culinary/"],"S10":["Atlantis Marina Village","https://www.atlantisbahamas.com/things-to-do/marina-village"],"S11":["Albany dining","https://www.albanybahamas.com/dining-venues/"],"S12":["Old Fort Bay Club tourism listing","https://www.bahamas.com/plan-your-trip/things-to-do/old-fort-bay-club"],"S13":["Shima tourism listing","https://www.bahamas.com/plan-your-trip/restaurants/shima"],"S14":["La Caverna","https://lacavernaristorante.com/"],"S15":["Poop Deck East tourism listing","https://www.bahamas.com/plan-your-trip/restaurants/poop-deck"],"S16":["The Balmoral Club","https://www.balmoralclub.com/"],"S17":["Albany amenities","https://www.albanybahamas.com/amenities/"],"G01":["Bahamas legislation index including landholding amendments","https://laws.bahamas.gov.bs/cms/legislation/index/by-alphabetical.html"],"G02":["Department of Inland Revenue real property tax","https://inlandrevenue.finance.gov.bs/real-property-tax/"],"G03":["Department of Inland Revenue VAT legislation","https://inlandrevenue.finance.gov.bs/value-added-tax/legal-vat/"],"G04":["Provisional VAT invoice guidance","https://inlandrevenue.finance.gov.bs/wp-content/uploads/2025/08/Requirement-for-Provisional-VAT-Invoice-Guidance-Note.pdf"],"G05":["CAA Bahamas commercial drone operations","https://caabahamas.com/commercial-drone/"],"G06":["Bahamas Film and Television Commission FAQs","https://bahamasfilm.com/faqs"],"G07":["Department of Immigration economic permanent residence application","https://www.immigration.gov.bs/wp-content/uploads/2019/10/PERMANENT-RESIDENCE-FORM-ECONOMIC.pdf"]},"shots":[["S01","Arrival and location","8–10 sec","Wide horizontal and separate vertical","Street sign or building exterior; avoid access codes and number plates."],["S02","Host hook","Two clean takes","Vertical + horizontal","Sienna facing soft light; lav mic; state property name, not unconfirmed price."],["S03","Hero reveal","10 sec","Horizontal + vertical","Slow move toward the strongest visible feature. Use listing-specific focus."],["S04","Exterior","8–10 sec","Horizontal + vertical","Facade and relationship to road, shoreline or neighboring building."],["S05","Main living space","10 sec","Horizontal + vertical","Static wide, then a slow doorway reveal; no misleading ultra-wide distortion."],["S06","Kitchen","8 sec each","Horizontal + vertical","Wide layout and two detail shots; capture circulation space."],["S07","Primary suite","8 sec each","Horizontal + vertical","Room, outlook and ensuite if permitted; exclude personal belongings."],["S08","Additional spaces","8 sec each","Horizontal + vertical","Guest suite, terrace, second dwelling or office as supported by listing."],["S09","Outdoor connection","10 sec","Horizontal + vertical","Pool, terrace, garden or shoreline; show road separation where relevant."],["S10","Buyer detail","8 sec + host line","Horizontal + vertical","Visible practical detail; host explains the specific question to verify."],["S11","Location cutaways","8 sec each","Horizontal + vertical","Permitted entrance, nearby dining exterior, public road and area view."],["S12","Host close","Two clean takes","Vertical + horizontal","Deliver the exact asset keyword and invite a viewing or buyer consultation."],["S13","Clean sound","30 sec","Audio","Room tone, then exterior ambience without conversation or music."],["S14","Optional aerial","Only after approval","Horizontal + vertical","Licensed operator, written CAA approval and location permission; ground alternative always available."]],"faqs":[{"id":"F01","question":"Can a non-Bahamian buy property?","answer":"Non-Bahamians can buy property in The Bahamas, but the registration or permission requirements depend on the purchase and intended use. Before signing, have a Bahamian attorney check the current law and the requirements for your specific property. I can help with the property search and coordinate the questions that need answers.","source_ids":"G01","gate":"Attorney review"},{"id":"F02","question":"Does buying a home give me residency?","answer":"Buying property and obtaining immigration status are separate processes. A purchase does not automatically give you residency, citizenship or permission to work. Before linking a purchase to relocation plans, get current advice on the application, qualifying conditions and any work restrictions. We’ll keep the property decision and immigration decision clearly documented.","source_ids":"G01 G07","gate":"Immigration professional review"},{"id":"F03","question":"What should my total budget include?","answer":"Start with the purchase price, then request an itemised estimate for taxes, legal fees, financing charges, inspections and other closing costs. Separately, budget for insurance, property tax, association or club fees, utilities and upkeep. The right comparison is what the property costs to buy and own, not only the advertised price.","source_ids":"G02 G03 G04","gate":"Attorney confirms transaction-specific costs"},{"id":"F04","question":"What taxes apply when I buy?","answer":"Do not use one percentage from an old social post as your closing budget. The treatment depends on the transaction and current rules. Ask your Bahamian attorney for a written calculation, including any required VAT invoice process, and confirm how the contract allocates costs between buyer and seller.","source_ids":"G03 G04","gate":"Attorney review; do not add unverified rates"},{"id":"F05","question":"What annual property tax will I pay?","answer":"Get the property’s current assessment, classification and payment position. Owner use, rental use and other circumstances can affect the applicable treatment. Have the annual cost estimated for your intended ownership and use, and confirm whether any arrears or compliance steps need to be resolved before closing.","source_ids":"G02","gate":"Attorney or tax professional review"},{"id":"F06","question":"Can I get financing?","answer":"Start lender conversations early. Ask which properties and borrower profiles they will consider, what documents they need and how they assess income and currency. Get terms for your own situation before deciding what you can spend. A mortgage estimate is not an approval, and financing conditions should be reflected in your offer.","source_ids":"","gate":"Lender confirms availability and terms"},{"id":"F07","question":"What happens after I find a home?","answer":"We organise the offer around your price, deposit, conditions and timing. Your attorney then guides the contract and due diligence, including the title and required approvals. Inspections, financing and other conditions need clear deadlines. Completion comes after the agreed requirements are satisfied, followed by the practical handover.","source_ids":"G01 G04","gate":"Attorney reviews sequence for transaction"},{"id":"F08","question":"How much deposit do I need?","answer":"There is no deposit figure I would promise before reviewing the proposed agreement. Confirm the amount, who holds it, when it is due and exactly what happens if a condition is not met. Your attorney should explain the contract before you send funds, and payment instructions should be independently verified.","source_ids":"","gate":"Attorney review"},{"id":"F09","question":"How long does a purchase take?","answer":"The timeline depends on the title, financing, inspections, approvals and how quickly documents are ready. Rather than promise a fixed closing date, we’ll map the steps and identify what could delay this particular purchase. Any target date should be coordinated with your attorney and the other parties.","source_ids":"","gate":"Attorney and lender input"},{"id":"F10","question":"Why do I need a Bahamian attorney?","answer":"Your attorney advises on the contract, title, ownership structure and applicable requirements. A real estate tour cannot establish those legal facts. Involve your attorney early, especially for land, inherited property, unusual access arrangements or a purchase intended for development or rentals. I’ll help organise the property information they need.","source_ids":"G01","gate":"Attorney review"},{"id":"F11","question":"What inspections should I arrange?","answer":"Start with the condition of the building, roof and services, then ask the relevant professionals about any specific concerns. For waterfront property, examine the shoreline and any dock or seawall. Review insurance options before closing. A beautiful renovation or a solar system does not remove the need to understand condition and maintenance.","source_ids":"","gate":"Inspector and insurer input"},{"id":"F12","question":"How do I compare a condo and a house?","answer":"A condo can shift some maintenance into an association, but you still need its budgets, reserves, insurance arrangements, rules and meeting records. With a house, understand the work and costs you manage directly. Compare the total ownership obligations and your preferred routine, alongside the floor plan and asking price.","source_ids":"","gate":"Association documents required"},{"id":"F13","question":"Does ownership include club or beach access?","answer":"Ask for the specific rights in writing. Club membership, marina use and resort access can be separate from ownership, even when the property is nearby. We’ll check what transfers to a buyer, any application process and the recurring costs. A view of an amenity is not evidence that you can use it.","source_ids":"","gate":"Property and club documents required"},{"id":"F14","question":"Can I offer short-term rentals?","answer":"Check the property’s legal use, association restrictions, any required registrations and insurance before relying on rental plans. Then review actual operating records where available, including management, maintenance and vacancy costs. An advertised nightly rate is not net income, and I would not promise an occupancy level or return.","source_ids":"G01 G02 G03","gate":"Attorney, association and rental operator review"},{"id":"F15","question":"What should I check before buying land?","answer":"Confirm the survey, boundaries, legal access, title and utility arrangements. Then obtain advice on planning requirements and what your proposed use would need. Waterfront does not automatically mean a dock is permitted, and a large parcel does not automatically mean it can be subdivided. The site and approvals should lead the design.","source_ids":"G01","gate":"Surveyor, attorney and planning confirmation"},{"id":"F16","question":"How is pre-construction different?","answer":"You are evaluating a proposed product and a contract as well as a location. Confirm the developer, construction stage, specifications, payment schedule, expected completion terms and what happens if plans or timing change. Renderings are conceptual. Have your attorney review the protections and obligations before committing.","source_ids":"","gate":"Attorney reviews development contract"},{"id":"F17","question":"Nassau, Abaco, Eleuthera or Exuma?","answer":"Start with your routine: how often you will visit, your preferred pace, school or work needs, and how you want to use the property. Compare actual flight and ground-transfer options, services, utilities and maintenance support for each location. We can build a viewing plan around those priorities instead of choosing from photographs alone.","source_ids":"","gate":"Verify travel and service availability for travel dates"},{"id":"F18","question":"How do I start my search with you?","answer":"Send me your preferred island, comfortable budget, intended use, timeline and three non-negotiables. I’ll help turn those into a focused shortlist and a viewing plan. We can begin with a video call if you are overseas. Message BUYBAHAMAS or email sienna@cbbahamas.com, and we’ll take the next step together.","source_ids":"","gate":"Confirm contact and booking arrangements"}],"assets":[{"id":"L01-T","subject":"L01","kind":"Listing tour","duration":"60–90 sec","script":"I’m Sienna Evans with Coldwell Banker Bahamas. Today we’re exploring The Rum Club in the Eastern Road area. The first thing I want you to notice is the relationship between the pool, the covered patio and the ocean view. Inside, the public listing describes five bedrooms, four bathrooms and a separate lower-level guest suite. We’ll walk through the living space, pause at the balcony and see how the guest area connects. One important detail: the waterfront is across Eastern Road, so we’ll show that relationship clearly. Message me RUMCLUB for the current details and a viewing plan.","caption":"Explore The Rum Club in Eastern Road. Ocean views, a private pool and a separate lower-level guest suite. MLS 67963. Message RUMCLUB for current availability and a viewing. Sienna Evans | Coldwell Banker Bahamas. #BahamasRealEstate Waterfront is across Eastern Road.","cta":"RUMCLUB","shots":"S01–S13; S14 optional. Focus: pool-to-sea reveal; living room to covered patio; kitchen; upstairs balcony; guest patio.","gate":"Waterfront lies across Eastern Road. Do not describe as direct beachfront. Obtain current availability and rental records before income claims. Confirm active status, price/currency, filming access and brokerage attribution.","source":"https://www.coldwellbankerbahamas.com/index.php?action=listingview&listingID=81632","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"L01-D","subject":"L01","kind":"One detail","duration":"25–40 sec","script":"Pool, patio and an ocean view: this is The Rum Club on Eastern Road. The waterfront is across the road, which is an important distinction when comparing waterfront homes. Come with me to see how the outdoor spaces and guest suite fit together. Message RUMCLUB to explore it with me.","caption":"A closer look at The Rum Club. MLS 67963. Save this for your Bahamas shortlist, or message RUMCLUB for the details. #BahamasProperty","cta":"RUMCLUB","shots":"S02, S03, S10, S12 + feature cutaways: pool-to-sea reveal; living room to covered patio; kitchen; upstairs balcony; guest patio","gate":"Waterfront lies across Eastern Road. Do not describe as direct beachfront. Obtain current availability and rental records before income claims.","source":"https://www.coldwellbankerbahamas.com/index.php?action=listingview&listingID=81632","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"L02-T","subject":"L02","kind":"Listing tour","duration":"60–90 sec","script":"I’m Sienna Evans with Coldwell Banker Bahamas. Today we’re exploring Starfish Isle 1204 in the Palm Cay area. What stands out is a double-unit townhome with a third-floor entertainment lounge. Let’s start with that feature, then follow how the home connects its living areas to the spaces you would use every day. As you watch, think about how you would spend your time here: hosting, relaxing, or making this your home base. We’ll also check the property’s current condition and exactly what comes with ownership. Message me HOME64694 for the current details and a viewing plan.","caption":"Explore Starfish Isle 1204 in Palm Cay. A double-unit townhome with a third-floor entertainment lounge. MLS 64694. Message HOME64694 for current availability and a viewing. Sienna Evans | Coldwell Banker Bahamas. #BahamasRealEstate","cta":"HOME64694","shots":"S01–S13; S14 optional. Focus: wide living space; kitchen island; primary balcony; lounge; gard "duration":"40–60 sec","script":"What could an ordinary day near Westridge and Caves corridor look like? Start with the route you would actually use for school or work. For schools, research Tambearly and western campuses appropriate for your child’s age. Then make time to explore oceanfront condos, daily errands and airport-side access. For a dining stop, consider La Caverna at Caves Village. We’ll confirm opening arrangements and access before you visit. Message CAVES for a location-led viewing plan.","caption":"Picture your routine around Westridge and Caves corridor. Schools, dining and lifestyle stops to research before choosing a home. Message CAVES. Admissions, access and opening arrangements need confirmation.","cta":"CAVES","shots":"M01 area/entrance; M02 host hook; M03 streetscape; M04 selected listing exterior; M05 school exterior from permitted position; M06 dining exterior/detail with consent; M07 lifestyle; M08 host comparison/CTA. Two takes, H + V.","gate":"Caves Point is the featured association; Westridge is a wider area, not the same development. Confirm access, venue hours, school location and admissions independently; no guaranteed commute times or resort rights.","source":"https://tambearlyschool.org/\nhttps://lacavernaristorante.com/","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"C12-Q","subject":"C12","kind":"Community buyer question","duration":"25–40 sec","script":"Before choosing Westridge and Caves corridor, ask about noise, road position and each association’s rules. The answer can change from one property to the next, even within the same community. Compare the documents alongside the view, and test the everyday routes before making your decision. Message CAVES and let’s narrow your shortlist.","caption":"Buying near Westridge and Caves corridor? Start with this question: Noise, road position and each association’s rules. Message CAVES to compare individual homes. #NassauRealEstate","cta":"CAVES","shots":"M01 area/entrance; M02 host hook; M03 streetscape; M04 selected listing exterior; M05 school exterior from permitted position; M06 dining exterior/detail with consent; M07 lifestyle; M08 host comparison/CTA. Two takes, H + V.","gate":"Caves Point is the featured association; Westridge is a wider area, not the same development. Confirm access, venue hours, school location and admissions independently; no guaranteed commute times or resort rights.","source":"https://tambearlyschool.org/\nhttps://lacavernaristorante.com/","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F01","subject":"FAQ","kind":"Buyer FAQ","duration":"25–45 sec","script":"Non-Bahamians can buy property in The Bahamas, but the registration or permission requirements depend on the purchase and intended use. Before signing, have a Bahamian attorney check the current law and the requirements for your specific property. I can help with the property search and coordinate the questions that need answers.","caption":"Buying in The Bahamas: Can a non-Bahamian buy property? Save this for your search. Message BUYBAHAMAS for a property consultation with Sienna Evans, Coldwell Banker Bahamas. General guidance; individual legal, tax and financing advice may be needed.","cta":"BUYBAHAMAS","shots":"A camera medium; B camera close; question on screen; one answer per take; leave 3 seconds before and after. Capture a second opener.","gate":"Attorney review","source":"https://laws.bahamas.gov.bs/cms/legislation/index/by-alphabetical.html","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F02","subject":"FAQ","kind":"Buyer FAQ","duration":"25–45 sec","script":"Buying property and obtaining immigration status are separate processes. A purchase does not automatically give you residency, citizenship or permission to work. Before linking a purchase to relocation plans, get current advice on the application, qualifying conditions and any work restrictions. We’ll keep the property decision and immigration decision clearly documented.","caption":"Buying in The Bahamas: Does buying a home give me residency? Save this for your search. Message BUYBAHAMAS for a property consultation with Sienna Evans, Coldwell Banker Bahamas. General guidance; individual legal, tax and financing advice may be needed.","cta":"BUYBAHAMAS","shots":"A camera medium; B camera close; question on screen; one answer per take; leave 3 seconds before and after. Capture a second opener.","gate":"Immigration professional review","source":"https://laws.bahamas.gov.bs/cms/legislation/index/by-alphabetical.html\nhttps://www.immigration.gov.bs/wp-content/uploads/2019/10/PERMANENT-RESIDENCE-FORM-ECONOMIC.pdf","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F03","subject":"FAQ","kind":"Buyer FAQ","duration":"25–45 sec","script":"Start with the purchase price, then request an itemised estimate for taxes, legal fees, financing charges, inspections and other closing costs. Separately, budget for insurance, property tax, association or club fees, utilities and upkeep. The right comparison is what the property costs to buy and own, not only the advertised price.","caption":"Buying in The Bahamas: What should my total budget include? Save this for your search. Message BUYBAHAMAS for a property consultation with Sienna Evans, Coldwell Banker Bahamas. General guidance; individual legal, tax and financing advice may be needed.","cta":"BUYBAHAMAS","shots":"A camera medium; B camera close; question on screen; one answer per take; leave 3 seconds before and after. Capture a second opener.","gate":"Attorney confirms transaction-specific costs","source":"https://inlandrevenue.finance.gov.bs/real-property-tax/\nhttps://inlandrevenue.finance.gov.bs/value-added-tax/legal-vat/\nhttps://inlandrevenue.finance.gov.bs/wp-content/uploads/2025/08/Requirement-for-Provisional-VAT-Invoice-Guidance-Note.pdf","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F04","subject":"FAQ","kind":"Buyer FAQ","duration":"25–45 sec","script":"Do not use one percentage from an old social post as your closing budget. The treatment depends on the transaction and current rules. Ask your Bahamian attorney for a written calculation, including any required VAT invoice process, and confirm how the contract allocates costs between buyer and seller.","caption":"Buying in The Bahamas: What taxes apply when I buy? Save this for your search. Message BUYBAHAMAS for a property consultation with Sienna Evans, Coldwell Banker Bahamas. General guidance; individual legal, tax and financing advice may be needed.","cta":"BUYBAHAMAS","shots":"A camera medium; B camera close; question on screen; one answer per take; leave 3 seconds before and after. Capture a second opener.","gate":"Attorney review; do not add unverified rates","source":"https://inlandrevenue.finance.gov.bs/value-added-tax/legal-vat/\nhttps://inlandrevenue.finance.gov.bs/wp-content/uploads/2025/08/Requirement-for-Provisional-VAT-Invoice-Guidance-Note.pdf","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F05","subject":"FAQ","kind":"Buyer FAQ","duration":"25–45 sec","script":"Get the property’s current assessment, classification and payment position. Owner use, rental use and other circumstances can affect the applicable treatment. Have the annual cost estimated for your intended ownership and use, and confirm whether any arrears or compliance steps need to be resolved before closing.","caption":"Buying in The Bahamas: What annual property tax will I pay? Save this for your search. Message BUYBAHAMAS for a property consultation with Sienna Evans, Coldwell Banker Bahamas. General guidance; individual legal, tax and financing advice may be needed.","cta":"BUYBAHAMAS","shots":"A camera medium; B camera close; question on screen; one answer per take; leave 3 seconds before and after. Capture a second opener.","gate":"Attorney or tax professional review","source":"https://inlandrevenue.finance.gov.bs/real-property-tax/","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F06","subject":"FAQ","kind":"Buyer FAQ","duration":"25–45 sec","script":"Start lender conversations early. Ask which properties and borrower profiles they will consider, what documents they need and how they assess income and currency. Get terms for your own situation before deciding what you can spend. A mortgage estimate is not an approval, and financing conditions should be reflected in your offer.","caption":"Buying in The Bahamas: Can I get financing? Save this for your search. Message BUYBAHAMAS for a property consultation with Sienna Evans, Coldwell Banker Bahamas. General guidance; individual legal, tax and financing advice may be needed.","cta":"BUYBAHAMAS","shots":"A camera medium; B camera close; question on screen; one answer per take; leave 3 seconds before and after. Capture a second opener.","gate":"Lender confirms availability and terms","source":"","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F07","subject":"FAQ","kind":"Buyer FAQ","duration":"25–45 sec","script":"We organise the offer around your price, deposit, conditions and timing. Your attorney then guides the contract and due diligence, including the title and required approvals. Inspections, financing and other conditions need clear deadlines. Completion comes after the agreed requirements are satisfied, followed by the practical handover.","caption":"Buying in The Bahamas: What happens after I find a home? Save this for your search. Message BUYBAHAMAS for a property consultation with Sienna Evans, Coldwell Banker Bahamas. General guidance; individual legal, tax and financing advice may be needed.","cta":"BUYBAHAMAS","shots":"A camera medium; B camera close; question on screen; one answer per take; leave 3 seconds before and after. Capture a second opener.","gate":"Attorney reviews sequence for transaction","source":"https://laws.bahamas.gov.bs/cms/legislation/index/by-alphabetical.html\nhttps://inlandrevenue.finance.gov.bs/wp-content/uploads/2025/08/Requirement-for-Provisional-VAT-Invoice-Guidance-Note.pdf","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F08","subject":"FAQ","kind":"Buyer FAQ","duration":"25–45 sec","script":"There is no deposit figure I would promise before reviewing the proposed agreement. Confirm the amount, who holds it, when it is due and exactly what happens if a condition is not met. Your attorney should explain the contract before you send funds, and payment instructions should be independently verified.","caption":"Buying in The Bahamas: How much deposit do I need? Save this for your search. Message BUYBAHAMAS for a property consultation with Sienna Evans, Coldwell Banker Bahamas. General guidance; individual legal, tax and financing advice may be needed.","cta":"BUYBAHAMAS","shots":"A camera medium; B camera close; question on screen; one answer per take; leave 3 seconds before and after. Capture a second opener.","gate":"Attorney review","source":"","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F09","subject":"FAQ","kind":"Buyer FAQ","duration":"25–45 sec","script":"The timeline depends on the title, financing, inspections, approvals and how quickly documents are ready. Rather than promise a fixed closing date, we’ll map the steps and identify what could delay this particular purchase. Any target date should be coordinated with your attorney and the other parties.","caption":"Buying in The Bahamas: How long does a purchase take? Save this for your search. Message BUYBAHAMAS for a property consultation with Sienna Evans, Coldwell Banker Bahamas. General guidance; individual legal, tax and financing advice may be needed.","cta":"BUYBAHAMAS","shots":"A camera medium; B camera close; question on screen; one answer per take; leave 3 seconds before and after. Capture a second opener.","gate":"Attorney and lender input","source":"","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F10","subject":"FAQ","kind":"Buyer FAQ","duration":"25–45 sec","script":"Your attorney advises on the contract, title, ownership structure and applicable requirements. A real estate tour cannot establish those legal facts. Involve your attorney early, especially for land, inherited property, unusual access arrangements or a purchase intended for development or rentals. I’ll help organise the property information they need.","caption":"Buying in The Bahamas: Why do I need a Bahamian attorney? Save this for your search. Message BUYBAHAMAS for a property consultation with Sienna Evans, Coldwell Banker Bahamas. General guidance; individual legal, tax and financing advice may be needed.","cta":"BUYBAHAMAS","shots":"A camera medium; B camera close; question on screen; one answer per take; leave 3 seconds before and after. Capture a second opener.","gate":"Attorney review","source":"https://laws.bahamas.gov.bs/cms/legislation/index/by-alphabetical.html","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F11","subject":"FAQ","kind":"Buyer FAQ","duration":"25–45 sec","script":"Start with the condition of the building, roof and services, then ask the relevant professionals about any specific concerns. For waterfront property, examine the shoreline and any dock or seawall. Review insurance options before closing. A beautiful renovation or a solar system does not remove the need to understand condition and maintenance.","caption":"Buying in The Bahamas: What inspections should I arrange? Save this for your search. Message BUYBAHAMAS for a property consultation with Sienna Evans, Coldwell Banker Bahamas. General guidance; individual legal, tax and financing advice may be needed.","cta":"BUYBAHAMAS","shots":"A camera medium; B camera close; question on screen; one answer per take; leave 3 seconds before and after. Capture a second opener.","gate":"Inspector and insurer input","source":"","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F12","subject":"FAQ","kind":"Buyer FAQ","duration":"25–45 sec","script":"A condo can shift some maintenance into an association, but you still need its budgets, reserves, insurance arrangements, rules and meeting records. With a house, understand the work and costs you manage directly. Compare the total ownership obligations and your preferred routine, alongside the floor plan and asking price.","caption":"Buying in The Bahamas: How do I compare a condo and a house? Save this for your search. Message BUYBAHAMAS for a property consultation with Sienna Evans, Coldwell Banker Bahamas. General guidance; individual legal, tax and financing advice may be needed.","cta":"BUYBAHAMAS","shots":"A camera medium; B camera close; question on screen; one answer per take; leave 3 seconds before and after. Capture a second opener.","gate":"Association documents required","source":"","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F13","subject":"FAQ","kind":"Buyer FAQ","duration":"25–45 sec","script":"Ask for the specific rights in writing. Club membership, marina use and resort access can be separate from ownership, even when the property is nearby. We’ll check what transfers to a buyer, any application process and the recurring costs. A view of an amenity is not evidence that you can use it.","caption":"Buying in The Bahamas: Does ownership include club or beach access? Save this for your search. Message BUYBAHAMAS for a property consultation with Sienna Evans, Coldwell Banker Bahamas. General guidance; individual legal, tax and financing advice may be needed.","cta":"BUYBAHAMAS","shots":"A camera medium; B camera close; question on screen; one answer per take; leave 3 seconds before and after. Capture a second opener.","gate":"Property and club documents required","source":"","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F14","subject":"FAQ","kind":"Buyer FAQ","duration":"25–45 sec","script":"Check the property’s legal use, association restrictions, any required registrations and insurance before relying on rental plans. Then review actual operating records where available, including management, maintenance and vacancy costs. An advertised nightly rate is not net income, and I would not promise an occupancy level or return.","caption":"Buying in The Bahamas: Can I offer short-term rentals? Save this for your search. Message BUYBAHAMAS for a property consultation with Sienna Evans, Coldwell Banker Bahamas. General guidance; individual legal, tax and financing advice may be needed.","cta":"BUYBAHAMAS","shots":"A camera medium; B camera close; question on screen; one answer per take; leave 3 seconds before and after. Capture a second opener.","gate":"Attorney, association and rental operator review","source":"https://laws.bahamas.gov.bs/cms/legislation/index/by-alphabetical.html\nhttps://inlandrevenue.finance.gov.bs/real-property-tax/\nhttps://inlandrevenue.finance.gov.bs/value-added-tax/legal-vat/","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F15","subject":"FAQ","kind":"Buyer FAQ","duration":"25–45 sec","script":"Confirm the survey, boundaries, legal access, title and utility arrangements. Then obtain advice on planning requirements and what your proposed use would need. Waterfront does not automatically mean a dock is permitted, and a large parcel does not automatically mean it can be subdivided. The site and approvals should lead the design.","caption":"Buying in The Bahamas: What should I check before buying land? Save this for your search. Message BUYBAHAMAS for a property consultation with Sienna Evans, Coldwell Banker Bahamas. General guidance; individual legal, tax and financing advice may be needed.","cta":"BUYBAHAMAS","shots":"A camera medium; B camera close; question on screen; one answer per take; leave 3 seconds before and after. Capture a second opener.","gate":"Surveyor, attorney and planning confirmation","source":"https://laws.bahamas.gov.bs/cms/legislation/index/by-alphabetical.html","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F16","subject":"FAQ","kind":"Buyer FAQ","duration":"25–45 sec","script":"You are evaluating a proposed product and a contract as well as a location. Confirm the developer, construction stage, specifications, payment schedule, expected completion terms and what happens if plans or timing change. Renderings are conceptual. Have your attorney review the protections and obligations before committing.","caption":"Buying in The Bahamas: How is pre-construction different? Save this for your search. Message BUYBAHAMAS for a property consultation with Sienna Evans, Coldwell Banker Bahamas. General guidance; individual legal, tax and financing advice may be needed.","cta":"BUYBAHAMAS","shots":"A camera medium; B camera close; question on screen; one answer per take; leave 3 seconds before and after. Capture a second opener.","gate":"Attorney reviews development contract","source":"","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F17","subject":"FAQ","kind":"Buyer FAQ","duration":"25–45 sec","script":"Start with your routine: how often you will visit, your preferred pace, school or work needs, and how you want to use the property. Compare actual flight and ground-transfer options, services, utilities and maintenance support for each location. We can build a viewing plan around those priorities instead of choosing from photographs alone.","caption":"Buying in The Bahamas: Nassau, Abaco, Eleuthera or Exuma? Save this for your search. Message BUYBAHAMAS for a property consultation with Sienna Evans, Coldwell Banker Bahamas. General guidance; individual legal, tax and financing advice may be needed.","cta":"BUYBAHAMAS","shots":"A camera medium; B camera close; question on screen; one answer per take; leave 3 seconds before and after. Capture a second opener.","gate":"Verify travel and service availability for travel dates","source":"","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F18","subject":"FAQ","kind":"Buyer FAQ","duration":"25–45 sec","script":"Send me your preferred island, comfortable budget, intended use, timeline and three non-negotiables. I’ll help turn those into a focused shortlist and a viewing plan. We can begin with a video call if you are overseas. Message BUYBAHAMAS or email sienna@cbbahamas.com, and we’ll take the next step together.","caption":"Buying in The Bahamas: How do I start my search with you? Save this for your search. Message BUYBAHAMAS for a property consultation with Sienna Evans, Coldwell Banker Bahamas. General guidance; individual legal, tax and financing advice may be needed.","cta":"BUYBAHAMAS","shots":"A camera medium; B camera close; question on screen; one answer per take; leave 3 seconds before and after. Capture a second opener.","gate":"Confirm contact and booking arrangements","source":"","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"L01-H","subject":"L01","kind":"Rum Club feature film","duration":"3–4 min incl. B-roll","script":"OPEN: Some homes make you pause before you even step inside. This is The Rum Club on Eastern Road. I’m Sienna Evans with Coldwell Banker Bahamas, and today we’re looking at the spaces that give this home its character.\nPOOL AND PATIO: Start here, with the pool, covered patio and ocean view. This is the place to imagine a slow morning or time with guests. Notice how the exterior spaces connect rather than judging each one separately.\nLIVING AND KITCHEN: Now let’s follow that connection inside. When I show a home, I want you to see the routes you’ll use: from the kitchen to the living area, and from the interior back outside.\nBEDROOMS: The public listing describes five bedrooms and four bathrooms. We’ll show the rooms in sequence so you can understand the layout and where the main outlooks are.\nGUEST SUITE: The lower-level guest suite is another part of the story. On a viewing, we’ll look at its access and how it fits your plans for family or visiting guests.\nLOCATION: One detail deserves a clear view: the waterfront lies across Eastern Road. We’re showing that road relationship because an ocean view and direct beachfront ownership are different things.\nCLOSE: If you can picture your days here, let’s explore the details together. Message RUMCLUB for current availability, the property information and a private viewing plan. I’m Sienna Evans, Coldwell Banker Bahamas.","caption":"The Rum Club, Eastern Road. Poolside living, an ocean outlook and a separate guest suite. Waterfront is across Eastern Road. MLS 67963. Message RUMCLUB for current details and a private viewing. Sienna Evans | Coldwell Banker Bahamas.","cta":"RUMCLUB","shots":"S01–S14 as permitted. Hero sequence: pool → patio → interior → balcony → guest suite → road context → close. 5–10 sec breathing room between chapters.","gate":"Confirm floor plan, guest-suite use, availability, price and access. No promised income or direct-beachfront claim.","source":"https://www.coldwellbankerbahamas.com/index.php?action=listingview&listingID=81632","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"F00","subject":"FAQ","kind":"FAQ compilation","duration":"10–14 min","script":"INTRO: Buying in The Bahamas starts with understanding both the home and the process. I’m Sienna Evans with Coldwell Banker Bahamas. Here are the questions I hear from buyers as they begin their search.\nCHAPTERS: Assemble F01 through F18 in order, using the complete answers in this workbook. Put each question on screen and keep the legal and tax review notes in the production workflow.\nOUTRO: Your best next step is a shortlist built around your budget, your intended use and your daily life. Message BUYBAHAMAS or email sienna@cbbahamas.com to arrange a conversation.","caption":"Your starting guide to buying in The Bahamas. Watch the full Q&A, then message BUYBAHAMAS with your island, budget and timeline. Sienna Evans | Coldwell Banker Bahamas. General information; get advice for your individual purchase.","cta":"BUYBAHAMAS","shots":"Film intro and outro; reuse F01–F18 answers with question cards. Horizontal master, captioned.","gate":"All component answers reviewed; no outdated tax rates or residency thresholds.","source":"https://laws.bahamas.gov.bs/cms/legislation/index/by-alphabetical.html\nhttps://inlandrevenue.finance.gov.bs/real-property-tax/\nhttps://inlandrevenue.finance.gov.bs/value-added-tax/legal-vat/\nhttps://inlandrevenue.finance.gov.bs/wp-content/uploads/2025/08/Requirement-for-Provisional-VAT-Invoice-Guidance-Note.pdf\nhttps://www.immigration.gov.bs/wp-content/uploads/2019/10/PERMANENT-RESIDENCE-FORM-ECONOMIC.pdf","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"},{"id":"N00","subject":"Nassau","kind":"Nassau buyer guide overview","duration":"2–3 min","script":"Where should you start your Nassau property search? I’m Sienna Evans with Coldwell Banker Bahamas. Let’s organise it around your life and the ownership costs. On the west, our shortlist explores Lyford Cay, Old Fort Bay and Albany, along with Sandyport and the Westridge and Caves corridor. We’ll compare individual homes, club arrangements and the journeys you make every day. Along Cable Beach, each condominium association has its own rules and costs. Around Balmoral, we’ll look at the homes and ask what comes with residential ownership. To the east, Eastern Road offers established residential settings, while Palm Cay and Port New Providence bring different marina and community arrangements to the comparison. Across the bridge, we’ll distinguish Ocean Club Estates from individual Paradise Island condominium buildings. These twelve locations are a starting point, not a ranking. Our selected asking prices illustrate specific properties and can change. Tell me your budget, your preferred routine and what matters most, and I’ll help you focus your viewing list. Message NASSAUGUIDE to start.","caption":"12 Nassau and Paradise Island locations, one practical starting point. Compare homes, school routes, dining, ownership costs and access terms. Message NASSAUGUIDE for a shortlist built around your life. Sienna Evans | Coldwell Banker Bahamas.","cta":"NASSAUGUIDE","shots":"Reuse community M01/M03/M07 footage. Add location labels and selected asking examples only after recheck.","gate":"No market averages, fixed travel times or automatic club rights. Confirm all displayed price cards.","source":"https://www.lcis.bs/home\nhttps://www.windsorschoolbahamas.com/about/campuses\nhttps://st-andrews.com/\nhttps://tambearlyschool.org/\nhttps://www.qchenceforth.com/","status":"Research complete / confirmation pending","owner":"Sienna + proposed Aliceon crew"}],"launch":[{"week":1,"slot":1,"asset":"L01-D"},{"week":1,"slot":2,"asset":"C09-Q"},{"week":1,"slot":3,"asset":"F01"},{"week":1,"slot":4,"asset":"L01-T"},{"week":1,"slot":5,"asset":"C09-L"},{"week":2,"slot":1,"asset":"C05-L"},{"week":2,"slot":2,"asset":"L11-D"},{"week":2,"slot":3,"asset":"F03"},{"week":2,"slot":4,"asset":"C05-Q"},{"week":2,"slot":5,"asset":"L10-D"},{"week":3,"slot":1,"asset":"C07-L"},{"week":3,"slot":2,"asset":"L12-D"},{"week":3,"slot":3,"asset":"F12"},{"week":3,"slot":4,"asset":"C07-Q"},{"week":3,"slot":5,"asset":"L14-D"},{"week":4,"slot":1,"asset":"C06-L"},{"week":4,"slot":2,"asset":"L02-D"},{"week":4,"slot":3,"asset":"F13"},{"week":4,"slot":4,"asset":"C10-Q"},{"week":4,"slot":5,"asset":"L17-D"},{"week":5,"slot":1,"asset":"C01-L"},{"week":5,"slot":2,"asset":"L04-D"},{"week":5,"slot":3,"asset":"F02"},{"week":5,"slot":4,"asset":"C02-Q"},{"week":5,"slot":5,"asset":"L06-D"},{"week":6,"slot":1,"asset":"C08-L"},{"week":6,"slot":2,"asset":"L15-D"},{"week":6,"slot":3,"asset":"F14"},{"week":6,"slot":4,"asset":"C04-Q"},{"week":6,"slot":5,"asset":"L03-D"},{"week":7,"slot":1,"asset":"L21-D"},{"week":7,"slot":2,"asset":"L22-D"},{"week":7,"slot":3,"asset":"F17"},{"week":7,"slot":4,"asset":"L23-D"},{"week":7,"slot":5,"asset":"C12-Q"},{"week":8,"slot":1,"asset":"L24-D"},{"week":8,"slot":2,"asset":"L25-D"},{"week":8,"slot":3,"asset":"F15"},{"week":8,"slot":4,"asset":"L26-D"},{"week":8,"slot":5,"asset":"L29-D"},{"week":9,"slot":1,"asset":"L27-D"},{"week":9,"slot":2,"asset":"L28-D"},{"week":9,"slot":3,"asset":"F16"},{"week":9,"slot":4,"asset":"C11-Q"},{"week":9,"slot":5,"asset":"L18-D"}]};</script><script>const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='sienna-bahamas-production-v1',STAGES=['Confirmation pending','Ready to film','Filmed','Editing','Review','Approved','Published'];
const ICONS={overview:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',listings:'M3 10l9-7 9 7 M5 9v12h14V9 M9 21v-8h6v8',communities:'M2 21h20 M4 21V8h6v13 M14 21V3h6v18 M6 11h2 M6 15h2 M16 7h2 M16 11h2 M16 15h2',scripts:'M4 3h12l4 4v14H4z M8 11h8 M8 15h8 M8 7h4',routes:'M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z M9 3v15 M15 6v15',faq:'M21 11a8 8 0 0 1-8 8H7l-5 3 2-7a8 8 0 1 1 17-4z M9 8a3 3 0 0 1 6 0c0 2-3 2-3 4 M12 15h.01',launch:'M4 5h16v16H4z M8 2v6 M16 2v6 M4 10h16 M8 14h2 M14 14h2',files:'M3 6h7l2 3h9v12H3z M3 6V3h7l2 3h7v3',settings:'M12 3v3 M12 18v3 M3 12h3 M18 12h3 M6 6l2 2 M16 16l2 2 M6 18l2-2 M16 8l2-2 M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0',search:'M16 16l5 5 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',check:'M4 12l5 5L20 6',play:'M8 4l12 8-12 8z'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[n]||ICONS.scripts}"/></svg>`;
const NAV=[['overview','Overview',''],['listings','Listings','29'],['communities','Communities','12'],['scripts','Script library','115'],['routes','Shoot routes','12'],['faq','Buyer FAQ','18'],['launch','Launch queue','45'],['files','Documents','3'],['settings','Brand & settings','']];
let D,state={assets:{},properties:{},routeDates:{},notes:{},domain:''},view='overview',filters={query:'',island:'all',format:'all',stage:'all',page:1},selectedRoute='D05',modalId=null,lastFocus=null,teleTimer=null,saveFailed=false;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.version===1)state={...state,...saved.data}}catch{}
const safeUrl=u=>/^https:\/\//.test(u||'')?esc(u):'#';
const stage=id=>state.assets[id]?.status||STAGES[0],as=a=>state.assets[a]||{},prop=id=>state.properties[id]||{},subject=id=>D.listings.find(r=>r.id===id)?.name||D.communities.find(r=>r.id===id)?.name||(id==='FAQ'?'Buying in The Bahamas':'Nassau buyer guide');
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),3300)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,data:state,updatedAt:new Date().toISOString()}));saveFailed=false;return true}catch{saveFailed=true;toast('Progress could not save. Export a backup before closing.');$('.device-note').textContent='Progress not saved — export a backup';return false}}
function setAsset(id,key,value){state.assets[id]={...as(id),[key]:value,updatedAt:new Date().toISOString()};save()}
// General production notes stay separate from agent-confirmation records.
function noteKeyAllowed(key){const [scope,id,...rest]=key.split(':');if(rest.length)return false;return scope==='module'?NAV.some(n=>n[0]===id):scope==='property'?D.listings.some(r=>r.id===id):scope==='community'?D.communities.some(c=>c.id===id):scope==='route'?D.routes.some(r=>r.id===id):scope==='asset'?D.assets.some(a=>a.id===id):false}
function noteRecord(key){if(key.startsWith('asset:')){const record=as(key.slice(6));return {text:record.notes||'',updatedAt:record.updatedAt||''}}return state.notes?.[key]||{text:'',updatedAt:''}}
function writeNote(key,text){if(!noteKeyAllowed(key))return false;const updatedAt=new Date().toISOString(),value=String(text).slice(0,10000);if(key.startsWith('asset:')){const id=key.slice(6);state.assets[id]={...as(id),notes:value,updatedAt}}else{state.notes??={};state.notes[key]={text:value,updatedAt}}return save()}
function notesEditor(key,label,placeholder='Ideas, changes to make, questions and filming reminders…',expanded=false){const note=noteRecord(key),hasNote=Boolean(note.text.trim()),inputId='note-'+key.replace(':','-');return `<details class="note-editor" data-note-panel="${esc(key)}" ${expanded?'open':''}><summary><span class="note-icon" aria-hidden="true">✎</span><span class="note-title">${esc(label)}</span><span class="note-badge" data-note-label>${hasNote?'View / edit notes':'Add notes'}</span><span class="note-chevron" aria-hidden="true">+</span></summary><div class="note-body"><label class="mini-label" for="${inputId}">Your notes</label><textarea id="${inputId}" data-workspace-note="${esc(key)}" aria-label="${esc(label)}" maxlength="10000" placeholder="${esc(placeholder)}">${esc(note.text)}</textarea><div class="note-footer"><span class="note-save" data-note-save role="status" aria-live="polite">${saveFailed?'Not saved — export progress before closing':hasNote?'Saved on this browser':'Saves automatically as you type'}</span><span class="note-count" data-note-count>${note.text.length.toLocaleString()} / 10,000</span></div><p class="note-help">Included in Export progress. Notes are saved on this browser and are not shared with the team yet.</p></div></details>`}
function showNotes(key){const panel=$(`[data-note-panel="${key}"]`);if(!panel)return;panel.open=true;panel.scrollIntoView({behavior:'smooth',block:'nearest'});panel.querySelector('textarea').focus()}
function updateNoteFeedback(el,ok){const panel=el.closest('.note-editor');if(!panel)return;panel.querySelector('[data-note-save]').textContent=ok?'Saved on this browser':'Not saved — export progress before closing';panel.querySelector('[data-note-save]').classList.toggle('note-error',!ok);panel.querySelector('[data-note-label]').textContent=el.value.trim()?'View / edit notes':'Add notes';panel.querySelector('[data-note-count]').textContent=el.value.length.toLocaleString()+' / 10,000'}
function getGroup(r){return ['ABACO','ELEUTHERA','EXUMA'].includes(r.community)?r.community:'NASSAU'}
const pill=(s,cls='')=>`<span class="pill ${cls}">${esc(s)}</span>`;
const statusPill=id=>pill(stage(id),stage(id)==='Confirmation pending'?'warning':stage(id)==='Published'?'navy':'');
function head(title,sub,extra=''){return `<div class="page-head"><div><div class="eyebrow">THE BAHAMAS · PRODUCTION STUDIO</div><h1>${title}</h1><p>${sub}</p></div><div class="head-right">${extra||'<span class="snapshot">Source snapshot · 16 Nov 2026</span>'}</div></div>`+notesEditor('module:'+view,'Notes for '+NAV.find(n=>n[0]===view)[1])}
function navigate(){let hash=location.hash.slice(1)||'overview';const [v,param]=hash.split('/');view=NAV.some(n=>n[0]===v)?v:'overview';filters={query:'',island:'all',format:'all',stage:'all',page:1};if(view==='listings'&&param)filters.island=param;$('#sidebar').classList.remove('open');render()}
function render(){closeModal(false);$('#nav').innerHTML=NAV.map(([id,label,n])=>`<a href="#${id}" class="nav-item ${id===view?'active':''}" ${id===view?'aria-current="page"':''}>${icon(id)}<span>${label}</span>${n?`<span class="nav-count">${n}</span>`:''}</a>`).join('');$('#crumb').textContent=NAV.find(n=>n[0]===view)[1];$('#main').innerHTML=({overview, listings,communities,scripts,routes,faq,launch,files,settings}[view])();}
function overview(){const ready=D.assets.filter(a=>stage(a.id)==='Ready to film').length,done=D.assets.filter(a=>['Filmed','Editing','Review','Approved','Published'].includes(stage(a.id))).length;return head('Every story starts here.','Your filming plan, property intelligence and creative work — in one place.')+`<div class="stats">${[[29,'Properties to explore','listings'],[12,'Community guides','communities'],[115,'Planned video edits','scripts'],[ready,'Ready to film','play']].map(([n,l,i])=>`<div class="stat"><div><div class="stat-number">${n}</div><div class="stat-label">${l}</div></div><div class="stat-icon">${icon(i)}</div></div>`).join('')}</div><section class="hero"><div class="hero-copy"><div class="eyebrow">THE FEATURE FILM · EASTERN ROAD</div><h2>The Rum Club</h2><p>Poolside living, an ocean outlook and a separate guest suite. Your signature property story, with every scene ready to capture.</p><div class="hero-meta"><div><b>67963</b>MLS number</div><div><b>3 edits</b>One filming day</div><div><b>D05</b>Dedicated route</div></div><div class="hero-actions"><button class="button light" data-action="asset" data-id="L01-H">Open feature script <span>↗</span></button><button class="button outline-light" data-action="listing" data-id="L01">Property details</button></div></div><div class="hero-art" aria-hidden="true"><div class="feature-frame"><div class="small-label">A SIENNA EVANS PROPERTY STORY</div><div class="serif">The Rum<br>Club.</div><div class="film-label"><span>EASTERN ROAD</span><span>01 / 29</span></div></div></div></section><div class="grid-two"><section class="panel"><div class="panel-head"><h2>Plan your next shoot</h2><a class="text-link" href="#routes">All routes ↗</a></div>${['D05','D03','D06'].map(id=>{const r=D.routes.find(r=>r.id===id);return `<div class="route-row"><div class="route-badge">${r.id}</div><div class="row-content"><div class="row-title">${r.name}</div><div class="row-sub">${r.listings.split(' ').length} ${r.listings.split(' ').length===1?'property':'properties'} · ${state.routeDates[id]?esc(state.routeDates[id]):'Date not set'}</div></div><button class="icon-button" data-action="route" data-id="${id}" aria-label="Open ${esc(r.name)}">↗</button></div>`}).join('')}</section><section class="panel"><div class="panel-head"><h2>Before the camera rolls</h2><span class="pill warning">Review notes</span></div>${[['L20','Caves Point','Conflicting asking prices'],['L14','Still Lake','Pre-construction capture'],['L29','Sola Vista Estate','Redevelopment land, not a home tour']].map(([id,n,t])=>`<div class="attention-row"><div class="attention-icon">!</div><div class="row-content"><div class="row-title">${n}</div><div class="row-sub">${t}</div></div><button class="text-link" data-action="listing" data-id="${id}">Review ↗</button></div>`).join('')}</section></div><div class="section-head"><h2>Beyond Nassau</h2><span class="small muted">Three properties. Each island.</span></div><div class="island-grid">${[['ABACO','Abaco','Waterfront homes & acreage'],['ELEUTHERA','Eleuthera','Beach houses & Banks Road'],['EXUMA','Exuma','Coastal homes & new possibilities']].map(([id,n,s])=>`<a href="#listings/${id}" class="island-tile"><div><h3>${n}</h3><p>${s}</p></div><span>↗</span></a>`).join('')}</div><div class="section-head"><h2>From capture to conversation</h2><span class="small muted">${done} / 115 edits captured</span></div><div class="panel"><div class="panel-body"><p class="small muted">Discover → compare communities → explore homes → answer buyer questions → consultation → viewing.</p><div class="progress-track"><span style="width:${done/115*100}%"></span></div><p class="small muted" style="margin-top:13px">Use each script’s message keyword to connect enquiries to the content that inspired them.</p></div></div>`}
function searchbar(extra=''){return `<div class="toolbar"><div class="search-box">${icon('search')}<input type="search" id="search" aria-label="Search ${view}" placeholder="${view==='listings'?'Search property, area or MLS number…':view==='scripts'?'Search scripts, keywords or subject…':'Search communities…'}" value="${esc(filters.query)}"></div>${extra}</div>`}
function options(arr,selected){return arr.map(([v,l])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(l)}</option>`).join('')}
function paginated(items,size,card){const pages=Math.max(1,Math.ceil(items.length/size));filters.page=Math.min(filters.page,pages);return `<div class="result-line">${items.length} results · Page ${filters.page} of ${pages}</div>${items.length?`<div class="card-grid">${items.slice((filters.page-1)*size,filters.page*size).map(card).join('')}</div>`:`<div class="empty"><h2>No matches yet.</h2><p class="muted">Try a different search or clear your filters.</p><button class="button" data-action="clear-filters">Clear filters</button></div>`}${pages>1?`<div class="pagination"><button class="button" data-action="page" data-dir="-1" ${filters.page===1?'disabled':''}>← Previous</button><span>${filters.page} / ${pages}</span><button class="button" data-action="page" data-dir="1" ${filters.page===pages?'disabled':''}>Next →</button></div>`:''}`}
function listingCard(r){return `<article class="listing-card"><div class="card-top"><span class="card-code">${r.id} / MLS ${r.mls}</span>${pill(r.type,r.type==='Pre-construction'?'warning':'')}</div><div class="card-body"><span class="card-area">${esc(r.area)}</span><h3>${esc(r.name)}</h3><div class="price">${r.price?'$'+Number(r.price).toLocaleString('en-US'):'Price confirmation needed'}<small>${r.price?'Public asking price · confirm currency':'$1,495,000 / $1,550,000 conflict'}</small></div><p class="card-description">${esc(r.feature)}</p><div class="small muted">${r.beds==='Not applicable'?esc(r.lot):esc(r.beds)+' beds · '+esc(r.baths)+' baths'}</div></div><div class="card-bottom"><button class="text-link" data-action="listing-notes" data-id="${r.id}" aria-label="Notes for ${esc(r.name)}">✎ Notes</button><button class="text-link" data-action="listing" data-id="${r.id}">Open filming card ↗</button></div></article>`}
function listings(){const q=filters.query.toLowerCase(),items=D.listings.filter(r=>(filters.island==='all'||getGroup(r)===filters.island)&&(filters.format==='all'||r.type===filters.format)&&[r.name,r.area,r.mls,r.feature,r.id].join(' ').toLowerCase().includes(q));return head('Property collection','A filming card for every property, from the first exterior shot to the final invitation.')+searchbar(`<select id="island-filter" aria-label="Filter island">${options([['all','All islands'],['NASSAU','Nassau / Paradise Island'],['ABACO','Abaco'],['ELEUTHERA','Eleuthera'],['EXUMA','Exuma']],filters.island)}</select><select id="format-filter" aria-label="Filter property type">${options([['all','All property types'],...['Home','Condo','Land','Pre-construction'].map(v=>[v,v])],filters.format)}</select>`)+`<div class="callout">Public Coldwell Banker website shortlist: 11 pages name CB agents; 18 are syndicated listings. Current availability and filming access require agent confirmation.</div><div id="filtered-content">${paginated(items,9,listingCard)}</div>`}
function communities(){const q=filters.query.toLowerCase(),items=D.communities.filter(c=>[c.name,c.location,c.tier,c.schools,c.restaurants].join(' ').toLowerCase().includes(q));return head('Life around the listing','Twelve Nassau and Paradise Island guides, shaped around real routines and ownership questions.')+searchbar()+`<div id="filtered-content">${paginated(items,12,c=>`<article class="community-card"><div class="card-top"><span class="card-code">${c.id} / COMMUNITY GUIDE</span><span class="small">3 edits</span></div><div class="card-body"><div class="card-area">${esc(c.location)}</div><h3>${esc(c.name)}</h3>${pill(c.tier)}<div class="mini-label">Explore</div><p class="small muted">${esc(c.lifestyle)}</p><div class="mini-label">Dining stops</div><p class="small muted">${esc(c.restaurants)}</p></div><div class="card-bottom"><button class="text-link" data-action="community-notes" data-id="${c.id}" aria-label="Notes for ${esc(c.name)}">✎ Notes</button><button class="text-link" data-action="community" data-id="${c.id}">Open guide ↗</button></div></article>`)}</div>`}
function scripts(){const q=filters.query.toLowerCase(),items=D.assets.filter(a=>(filters.format==='all'||a.kind===filters.format)&&(filters.stage==='all'||stage(a.id)===filters.stage)&&[a.id,a.script,a.cta,subject(a.subject),a.kind].join(' ').toLowerCase().includes(q));return head('Words, ready for the camera.','Spoken scripts, captions, shot directions and review notes for all 115 planned edits.')+searchbar(`<select id="format-filter" aria-label="Filter video format">${options([['all','All video formats'],...[...new Set(D.assets.map(a=>a.kind))].map(k=>[k,k])],filters.format)}</select><select id="stage-filter" aria-label="Filter production status">${options([['all','All production stages'],...STAGES.map(s=>[s,s])],filters.stage)}</select>`)+`<div id="filtered-content">${paginated(items,12,a=>`<article class="asset-card"><div class="card-top"><span class="card-code">${a.id}</span>${pill(a.duration)}</div><div class="card-body"><div class="card-area">${esc(a.kind)}</div><h3>${esc(subject(a.subject))}</h3><p class="script-excerpt">${esc(a.script)}</p><label class="mini-label" for="stage-${a.id}">Production status</label><select id="stage-${a.id}" data-status="${a.id}" aria-label="Status for ${a.id}">${options(STAGES.map(s=>[s,s]),stage(a.id))}</select></div><div class="card-bottom"><button class="text-link" data-action="asset" data-id="${a.id}">Open script ↗</button><button class="button" data-action="copy-caption" data-id="${a.id}">Copy caption</button></div></article>`)}</div>`}
function routes(){const r=D.routes.find(x=>x.id===selectedRoute)||D.routes[0],stops=r.listings.split(' ').filter(Boolean).map(id=>D.listings.find(x=>x.id===id)),query=stops[0]?.map_query||'Nassau Bahamas';return head('A considered route. A better shoot.','Geographic shoot blocks with property stops, community coverage and practical timing.')+`<div class="route-layout"><div class="route-list">${D.routes.map(x=>`<button class="route-choice ${x.id===r.id?'selected':''}" data-action="select-route" data-id="${x.id}"><span class="card-code">${x.id}</span><strong>${esc(x.name)}</strong><small>${x.listings?x.listings.split(' ').length+' properties':'18 FAQ answers'}</small></button>`).join('')}</div><section class="panel"><div class="panel-head"><div><div class="eyebrow">SHOOT BLOCK ${r.id}</div><h2>${esc(r.name)}</h2></div>${r.id!=='F01'?`<a class="button" href="${safeUrl(r.url)}" target="_blank" rel="noopener">Open route ↗</a>`:''}</div><div class="panel-body"><div class="callout">${esc(r.note)}</div><div class="form-row"><label for="route-date">Your planned shoot date</label><input id="route-date" type="date" value="${esc(state.routeDates[r.id]||'')}" data-route="${r.id}"><p class="small muted" style="margin-top:6px">A planning date only; no booking or invitation is sent.</p></div>${notesEditor('route:'+r.id,'Shoot notes for '+r.name,'Crew, timings, access arrangements, weather alternatives…')}<div class="mini-label">Property stops · final order to confirm</div><ol class="stop-list">${stops.map((s,i)=>`<li><span class="stop-number">${i+1}</span><div class="row-content"><div class="row-title">${esc(s.name)}</div><div class="row-sub">${s.id} · MLS ${s.mls} · ${esc(s.area)}</div></div><button class="text-link" data-action="listing" data-id="${s.id}">Details ↗</button></li>`).join('')||'<li>Quiet studio, two cameras, Sienna hosting. Open Buyer FAQ for all answers.</li>'}</ol><p class="small muted" style="margin-top:18px">Area orientation only. Obtain exact unit, lot and gate function loadRouteMap(id){const route=D.routes.find(r=>r.id===id);if(!route)return;const firstId=route.listings.split(' ').find(Boolean),query=D.listings.find(r=>r.id===firstId)?.map_query||'Nassau Bahamas',slot=$('#route-map-slot');if(!slot)return;slot.className='';slot.innerHTML=`<iframe class="route-map" title="Area orientation for ${esc(route.name)}" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${encodeURIComponent(query)}&output=embed"></iframe>`}
function faq(){return head('Buying in The Bahamas','A sit-down filming session that makes the buying process approachable, one question at a time.',`<button class="button primary" data-action="asset" data-id="F00">Full session script ↗</button>`)+`<div class="grid-two"><section class="panel"><div class="panel-body"><div class="eyebrow">THE SESSION</div><h2>18 questions. Four focused hours.</h2><p class="small muted" style="margin-top:13px">Two camera angles, soft light and a quiet room. Record each answer separately with a clean opener and closer. Assemble the full guide from the approved clips.</p><div class="modal-actions"><button class="button" data-action="asset" data-id="F00">Intro & outro</button><button class="button" data-action="route" data-id="F01">Session planning</button></div></div></section><section class="panel"><div class="panel-body"><div class="eyebrow">REVIEW BEFORE RELEASE</div><h2>Clear guidance, current facts.</h2><p class="small muted" style="margin-top:13px">Legal, tax, immigration and financing answers have their own review notes. Confirm the rules for the individual transaction; the scripts avoid fixed tax rates and automatic residency promises.</p></div></section></div><div class="faq-grid">${D.faqs.map(f=>`<details class="faq-item"><summary><span class="card-code">${f.id}</span><span>${esc(f.question)}</span></summary><div class="faq-answer"><p>${esc(f.answer)}</p><p class="small muted" style="margin-top:14px">Review: ${esc(f.gate)}</p>${notesEditor('asset:'+f.id,'Notes for '+f.id,'Questions to clarify, answer changes, best take…')}<button class="button" data-action="asset" data-id="${f.id}">Open filming script ↗</button></div></details>`).join('')}</div>`}
function launch(){return head('A steady rhythm of stories.','A proposed nine-week opening queue: five short videos each week, released only when ready.')+`<div class="callout">This queue is a production plan. No posts are automatically scheduled or published. Use the original asset keyword to record where enquiries came from.</div><section class="panel"><div class="panel-head"><h2>The first 45 short videos</h2><a class="text-link" href="#scripts">View script library ↗</a></div>${Array.from({length:9},(_,i)=>`<div class="launch-week"><div class="week-label">WEEK ${String(i+1).padStart(2,'0')}</div><div class="week-assets">${D.launch.filter(r=>r.week===i+1).map(r=>`<button data-action="asset" data-id="${r.asset}" title="${esc(subject(D.assets.find(a=>a.id===r.asset).subject))}">${r.slot}. ${r.asset} · ${esc(stage(r.asset))}</button>`).join('')}</div></div>`).join('')}</section><div class="grid-two" style="margin-top:24px"><section class="panel"><div class="panel-body"><h2>Make the next step easy.</h2><p class="small muted" style="margin-top:14px">Discover → community comparison → property detail → buyer FAQ → consultation → viewing.</p><p class="small muted" style="margin-top:14px">Qualify enquiries by island, budget, intended use, timeline and three must-haves. Track consultations and viewings alongside reach and saves.</p></div></section><section class="panel"><div class="panel-body"><h2>A warm first reply.</h2><p class="small muted" style="margin-top:14px">“Thank you for your interest. Which island are you considering, what budget feels comfortable, how will you use the property, and what is your timeline? Share your top three must-haves and we can arrange a call.”</p></div></section></div>`}

function settings(){return head('Built around your brand.','Your approved identity, workspace data and deployment notes.')+`<section class="panel"><div class="panel-head"><h2>Deep coastal luxury</h2><span class="pill">Official palette · v1.0</span></div><div class="panel-body"><div class="palette">${[['Midnight Navy','#071B2C'],['Coldwell Banker Blue','#012169'],['Deep Ocean','#123F43'],['Warm Ivory','#F4F0E8'],['Champagne','#B5A17A']].map(([n,c])=>`<div><div class="swatch-color" style="background:${c};border:1px solid #071b2c15"></div><p>${n}</p><code>${c}</code></div>`).join('')}</div><div class="divider"></div><div class="grid-two"><div><div class="mini-label">Display typography</div><div class="serif" style="font-size:34px">Bodoni Moda</div><p class="small muted">Property headlines and the Bahamas Real Estate Pilot title.</p></div><div><div class="mini-label">Body typography</div><div style="font-size:30px;margin-bottom:6px">Roboto</div><p class="small muted">Descriptions, prices, scripts and practical details.</p></div></div><a class="source-link" href="https://chatgpt.com/library?file_id=libfile_6651d008569081918c55aff6431a66e8&account_id=personal" target="_blank" rel="noopener">Open official brand reference ↗</a><p class="small muted">Personal brand extension for Sienna Evans. Any brokerage logo must be supplied in its approved form; this dashboard does not recreate it.</p></div></section><div class="settings-grid" style="margin-top:22px"><section class="panel"><div class="panel-head"><h2>Your workspace data</h2></div><div class="panel-body"><p class="small muted">Statuses, shot ticks, notes and shoot dates are stored on this browser. They do not automatically synchronise across devices or team members. Export a backup before switching browsers; import it on the new device.</p><div class="modal-actions"><button class="button primary" data-action="export">Export progress</button><button class="button" data-action="import">Import backup</button></div><p class="small muted" style="margin-top:15px">Import replaces the current browser’s progress after confirmation. The listing source catalogue stays unchanged.</p></div></section><section class="panel"><div class="panel-head"><h2>Your own domain</h2></div><div class="panel-body"><p class="small muted">A custom domain can point to this dashboard after hosting and DNS are configured. Save the address you intend to use below.</p><div class="form-row" style="margin-top:16px"><label for="domain-note">Planned domain or subdomain</label><input id="domain-note" placeholder="studio.yourdomain.com" value="${esc(state.domain)}" maxlength="253"><p class="small muted" style="margin-top:8px">A planning note only. This field does not configure DNS.</p></div><p class="small muted">This is an internal production workspace. Keep access restricted when hosting it on your domain.</p></div></section></div>`}

function openModal(title,subtitle,body){clearInterval(teleTimer);teleTimer=null;lastFocus=document.activeElement;$('#modal-content').innerHTML=`<div class="modal-head"><div><h2 id="modal-title">${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="icon-button" data-action="close" aria-label="Close dialog">×</button></div><div class="modal-body">${body}</div>`;$('#modal').hidden=false;document.body.classList.add('modal-open');document.body.style.overflow='hidden';$('#modal [data-action="close"]').focus()}
